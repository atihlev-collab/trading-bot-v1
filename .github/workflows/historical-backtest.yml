name: Historical strategy research

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run historical backtest
        run: |
          set -o pipefail
          python -u backtest.py 2>&1 | tee backtest-results.txt
      - name: Save backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-report
          path: backtest-results.txt
          if-no-files-found: warn
          retention-days: 7
