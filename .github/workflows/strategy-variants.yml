name: Strategy variant research

on:
  pull_request:
    branches: ["main"]
    types: [synchronize]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compare exit variants on chronological holdout
        run: |
          set -o pipefail
          python -u research.py 2>&1 | tee strategy-variants-results.txt
      - name: Save comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-variant-results
          path: strategy-variants-results.txt
          if-no-files-found: warn
          retention-days: 7
